root: ./

# Deze GitBook is gearchiveerd. De cursus staat nu op
# https://webtechnologie.apload.be/
#
# Alle oude pagina's sturen door naar de landingspagina README.md, die naar de
# nieuwe cursus linkt. GitBook kan in .gitbook.yaml niet naar een externe URL
# doorsturen: een redirect moet naar een pagina in deze space wijzen. Vandaar de
# tussenstap via die landingspagina.
#
# /labos en /projectopdracht staan niet in deze lijst: GitBook blijft die twee
# paden zelf afhandelen omdat het mappen met onderliggende pagina's waren, zodat
# een redirect er niet op aanslaat. Die twee hebben daarom hun eigen pagina die
# naar de nieuwe site verwijst.
#
# De lijst bevat elk pad dat ooit bestaan heeft: de structuur van vlak voor de
# archivering en de oudere paden van voor de herstructurering van de
# theoriemappen. Zo blijven bookmarks van studenten werken.
